<!DOCTYPE html>
<html>
<body>
<h2>CyberArena Event Stream</h2>
<pre id="log"></pre>

<script>
const log = document.getElementById("log");
const ws = new WebSocket("ws://localhost:8000/ws");

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    log.textContent += JSON.stringify(data, null, 2) + "\n";
};
</script>
</body>
</html>
