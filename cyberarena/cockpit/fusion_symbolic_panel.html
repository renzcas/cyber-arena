<!DOCTYPE html>
<html>
<head>
    <title>Fusion Symbolic Panel</title>
    <style>
        body { font-family: monospace; background: #111; color: #0ff; padding: 20px; }
        #log { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Fusion Engine: Symbolic State</h2>
    <div id="log"></div>

    <script>
        const log = document.getElementById("log");
        const ws = new WebSocket("ws://" + location.host + "/ws");

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "fusion.symbolic") {
                log.textContent += JSON.stringify(data.payload, null, 2) + "\n\n";
            }
        };
    </script>
</body>
</html>
